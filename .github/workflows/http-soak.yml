name: http soak

on:
    workflow_dispatch:
        inputs:
            minutes:
                description: "Duration in minutes"
                required: false
                default: "180"
            connections:
                description: "Number of concurrent connections (optional)"
                required: false

permissions:
    contents: read

env:
    NODE_VERSION: "26.9.0"

jobs:
    # The job timeout follows the minutes input: the run plus 30 minutes for
    # the build, the settle time and the report (expressions cannot add).
    plan:
        runs-on: ubuntu-latest
        outputs:
            timeout: ${{ steps.timeout.outputs.minutes }}
        steps:
            - id: timeout
              shell: bash
              env:
                  MINUTES: ${{ inputs.minutes || '180' }}
              run: |
                  minutes=$(awk -v m="$MINUTES" 'BEGIN { printf "%d", (m == int(m) ? m : int(m) + 1) + 30 }')
                  echo "minutes=$minutes" >> "$GITHUB_OUTPUT"

    soak:
        needs: plan
        runs-on: ubuntu-latest
        timeout-minutes: ${{ fromJSON(needs.plan.outputs.timeout) }}
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: npm
            - run: npm ci
            - run: npm run build
            - run: node scripts/http-soak.mjs
              env:
                  NONA_SOAK_MINUTES: ${{ github.event.inputs.minutes }}
                  NONA_SOAK_CONNECTIONS: ${{ github.event.inputs.connections }}
            - uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: soak-report
                  path: soak-report/
            - run: cat soak-report/http-soak.md >> $GITHUB_STEP_SUMMARY
              if: always()
              shell: bash
