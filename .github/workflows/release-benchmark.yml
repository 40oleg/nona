name: release-benchmark
env:
    NODE_VERSION: "26.9.0"
on:
    pull_request:
        types: [opened, synchronize, reopened, ready_for_review]
    workflow_dispatch:
permissions:
    contents: read
concurrency:
    group: release-benchmark-${{ github.event.pull_request.number || github.ref }}
    # Keep a measurement in progress: later documentation edits must not
    # destroy its raw results. All workloads run sequentially on one machine.
    cancel-in-progress: false
jobs:
    benchmark:
        if: github.event_name == 'workflow_dispatch' || startsWith(github.event.pull_request.title, '[nona] Release ')
        runs-on: ubuntu-24.04
        timeout-minutes: 240
        defaults:
            run:
                shell: bash
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: ${{ github.event.pull_request.head.sha || github.sha }}
            - name: Record source identity and measurement protocol
              run: |
                  mkdir -p work/release-benchmark
                  git rev-parse HEAD > work/release-benchmark/source-sha.txt
                  git show -s --format=fuller HEAD > work/release-benchmark/source.txt
                  cp bench/README.md work/release-benchmark/protocol.md
                  sha256sum bench/report.mjs bench/real/fetch.mjs bench/awfy/fetch.mjs package-lock.json > work/release-benchmark/source-sha256.txt
                  printf '%s\n' 'GitHub-hosted Ubuntu runner; infrastructure contention is unknown. All benchmark suites and HTTP generators run sequentially on this machine.' > work/release-benchmark/machine-sharing.txt
            - uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: npm
            - uses: denoland/setup-deno@v2
              with:
                  deno-version: latest
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest
            - name: Install measurement and profiling tools
              id: tools
              run: |
                  sudo apt-get update
                  sudo apt-get install -y hyperfine valgrind qemu-user binutils time gcc make util-linux wrk
            - name: Record machine and actual runtime versions
              run: |
                  {
                    date --utc --iso-8601=seconds
                    uname -a
                    cat /etc/os-release
                    lscpu
                    free -h
                    taskset -pc $$
                    for governor in /sys/devices/system/cpu/cpu*/cpufreq/scaling_governor; do
                      if [ -r "$governor" ]; then printf '%s: %s\n' "$governor" "$(cat "$governor")"; fi
                    done
                    node --version
                    npm --version
                    deno --version
                    bun --version
                    bun --revision
                    hyperfine --version
                    valgrind --version
                    qemu-x86_64 --version
                    objdump --version
                    gcc --version
                    /usr/bin/time --version
                    dpkg-query -W hyperfine valgrind qemu-user binutils time gcc util-linux wrk
                  } > work/release-benchmark/machine-and-versions.txt
                  node --input-type=module -e 'import { availableRuntimes, machine, versions } from "./bench/lib/measure.mjs"; import { writeFileSync } from "node:fs"; const available = availableRuntimes(); if (Object.values(available).some(value => !value)) throw new Error("All four runtimes are required"); writeFileSync("work/release-benchmark/environment.json", JSON.stringify({date: new Date().toISOString(), machine: machine(), versions: versions(), available}, null, 2));'
                  mapfile -t benchmark_cpus < <(python3 -c 'import os; print(*sorted(os.sched_getaffinity(0))[:2], sep="\n")')
                  test "${#benchmark_cpus[@]}" -eq 2
                  printf 'SERVER_CPU=%s\nCLIENT_CPU=%s\n' "${benchmark_cpus[0]}" "${benchmark_cpus[1]}" >> "$GITHUB_ENV"
            - run: npm ci
            - name: Build the measured compiler
              id: build
              run: npm run build
            - name: Fetch pinned third-party benchmark sources
              run: |
                  node bench/real/fetch.mjs 2>&1 | tee work/release-benchmark/fetch-real.log
                  node bench/awfy/fetch.mjs 2>&1 | tee work/release-benchmark/fetch-awfy.log
                  cp bench/awfy/vendor/REVISION work/release-benchmark/awfy-revision.txt
                  sha256sum bench/real/vendor/*/package.json > work/release-benchmark/vendor-package-sha256.txt
            - name: Retain every hyperfine sample export
              run: |
                  mkdir -p work/release-benchmark/hyperfine work/benchmark-bin
                  printf 'BENCHMARK_REAL_HYPERFINE=%s\nBENCHMARK_RAW_DIR=%s/work/release-benchmark/hyperfine\n' "$(command -v hyperfine)" "$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
                  cat > work/benchmark-bin/hyperfine <<'BASH'
                  #!/bin/bash
                  export_file=
                  previous=
                  for argument in "$@"; do
                    if [ "$previous" = --export-json ]; then export_file=$argument; fi
                    previous=$argument
                  done
                  status=0
                  "$BENCHMARK_REAL_HYPERFINE" "$@" || status=$?
                  if [ "$status" -eq 0 ] && [ -n "$export_file" ] && [ -f "$export_file" ]; then
                    saved=$(mktemp "$BENCHMARK_RAW_DIR/samples-XXXXXX.json")
                    cp "$export_file" "$saved"
                  fi
                  exit "$status"
                  BASH
                  chmod +x work/benchmark-bin/hyperfine
                  printf '%s/work/benchmark-bin\n' "$GITHUB_WORKSPACE" >> "$GITHUB_PATH"
            - name: Run all report suites with the release protocol
              id: report
              run: |
                  status=0
                  node bench/report.mjs --suite startup,corpus,micro,real,awfy,game,profile --runs 10 --startup-runs 30 --iterations 10 --scale 0.1 --runtimes node,deno,bun,nona --out work/release-benchmark > work/release-benchmark/report.stdout.md 2> work/release-benchmark/report.stderr.log || status=$?
                  if [ "$status" -ne 0 ]; then tail -n 80 work/release-benchmark/report.stderr.log; fi
                  exit "$status"
            - name: Retain report evidence before the HTTP measurements
              if: ${{ always() && steps.report.outcome != 'skipped' }}
              uses: actions/upload-artifact@v4
              with:
                  name: release-benchmark-report-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
                  retention-days: 90
                  if-no-files-found: error
                  path: work/release-benchmark
            - name: Preserve raw output and status from every HTTP generator invocation
              if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.tools.outcome == 'success' }}
              run: |
                  mkdir -p work/benchmark-bin
                  printf 'BENCHMARK_REAL_GCC=%s\nBENCHMARK_REAL_WRK=%s\nBENCHMARK_HTTP_RECORDER=%s/work/benchmark-bin/record-http.mjs\n' "$(command -v gcc)" "$(command -v wrk)" "$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
                  cat > work/benchmark-bin/record-http.mjs <<'JS'
                  import { appendFileSync } from 'node:fs';
                  import { spawnSync } from 'node:child_process';
                  const [generator, command, ...args] = process.argv.slice(2);
                  const startedAt = new Date().toISOString();
                  const warmup = generator === 'load' ? args[2] === '2' : args.includes('-d2s');
                  let preflight;
                  if (warmup) {
                    // load.c does not inspect HTTP status codes. Verify each
                    // runtime/case separately before its unmeasured warm-up.
                    try {
                      const url = generator === 'load' ? `http://127.0.0.1:${args[0]}${args[3]}` : args.find(value => value.startsWith('http://127.0.0.1:'));
                      const path = new URL(url).pathname;
                      const headers = {'Connection': 'close'};
                      if (path === '/headers') for (const name of ['user-agent', 'accept', 'accept-language', 'accept-encoding', 'x-request-id', 'x-forwarded-for', 'x-trace', 'referer', 'cache-control', 'if-none-match']) headers[name] = 'probe';
                      const expected = path === '/' ? 'Hello, World!' : path === '/json' ? JSON.stringify({id: 42, name: 'Ada Lovelace', email: 'ada@example.com', roles: ['admin', 'dev'], active: true}) : path === '/headers' ? 'headers 50' : path === '/upload' ? 'got 16384' : path === '/big' ? 'x'.repeat(65536) : null;
                      const response = await fetch(url, {method: path === '/upload' ? 'POST' : 'GET', headers, body: path === '/upload' ? 'x'.repeat(16384) : undefined, signal: AbortSignal.timeout(5000)});
                      const actual = await response.text();
                      preflight = {ok: expected !== null && response.status === 200 && actual === expected, status: response.status, bytes: Buffer.byteLength(actual)};
                    } catch (error) { preflight = {ok: false, error: String(error)}; }
                  }
                  const started = performance.now();
                  const result = spawnSync(command, args, {encoding: 'utf8', timeout: 60_000, maxBuffer: 16 * 1024 * 1024});
                  const record = {generator, args, startedAt, preflight, elapsedMs: performance.now() - started, status: result.status, signal: result.signal, error: result.error?.message, stdout: result.stdout ?? '', stderr: result.stderr ?? ''};
                  appendFileSync(process.env.BENCHMARK_HTTP_RAW, JSON.stringify(record) + '\n');
                  process.stdout.write(record.stdout);
                  process.stderr.write(record.stderr);
                  if (record.error || record.signal || record.status !== 0) process.exitCode = record.status || 1;
                  JS
                  cat > work/benchmark-bin/gcc <<'BASH'
                  #!/bin/bash
                  "$BENCHMARK_REAL_GCC" "$@" || exit $?
                  output=
                  previous=
                  for argument in "$@"; do
                    if [ "$previous" = -o ]; then output=$argument; fi
                    previous=$argument
                  done
                  if [ "$output" = /tmp/nona-http-load ]; then
                    mv -f "$output" "$output.real" || exit $?
                    cat > "$output" <<'LOAD'
                  #!/bin/bash
                  exec node "$BENCHMARK_HTTP_RECORDER" load /tmp/nona-http-load.real "$@"
                  LOAD
                    chmod +x "$output"
                  fi
                  BASH
                  cat > work/benchmark-bin/wrk <<'BASH'
                  #!/bin/bash
                  exec node "$BENCHMARK_HTTP_RECORDER" wrk "$BENCHMARK_REAL_WRK" "$@"
                  BASH
                  chmod +x work/benchmark-bin/gcc work/benchmark-bin/wrk
                  printf '%s/work/benchmark-bin\n' "$GITHUB_WORKSPACE" >> "$GITHUB_PATH"
            - name: HTTP protocol with the dependency-free load generator
              id: http_load
              if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.tools.outcome == 'success' }}
              env:
                  GEN: load
                  CONNS: "1 32 256"
                  RUNS: "5"
                  SECS: "3"
                  WARM: "2"
                  BENCHMARK_HTTP_RAW: ${{ github.workspace }}/work/release-benchmark/http-load.samples.jsonl
              run: bash -x bench/http/run.sh > work/release-benchmark/http-load.md 2> work/release-benchmark/http-load.trace.log
            - name: HTTP protocol with wrk
              id: http_wrk
              if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.tools.outcome == 'success' }}
              env:
                  GEN: wrk
                  CONNS: "1 32 256"
                  RUNS: "5"
                  SECS: "3"
                  WARM: "2"
                  BENCHMARK_HTTP_RAW: ${{ github.workspace }}/work/release-benchmark/http-wrk.samples.jsonl
              run: bash -x bench/http/run.sh > work/release-benchmark/http-wrk.md 2> work/release-benchmark/http-wrk.trace.log
            - name: Check completeness and report workload failures
              if: ${{ always() && steps.report.outcome != 'skipped' }}
              env:
                  REPORT_OUTCOME: ${{ steps.report.outcome }}
                  HTTP_LOAD_OUTCOME: ${{ steps.http_load.outcome }}
                  HTTP_WRK_OUTCOME: ${{ steps.http_wrk.outcome }}
              run: |
                  node --input-type=module <<'JS'
                  import { appendFileSync, existsSync, readFileSync, readdirSync, writeFileSync } from 'node:fs';
                  const directory = 'work/release-benchmark';
                  const problems = [], limitations = [];
                  const suites = ['startup', 'corpus', 'micro', 'real', 'awfy', 'game', 'profile'];
                  const counts = {startup: 2, corpus: 10, micro: readdirSync('bench').filter(name => /^\d\d_.*\.m?js$/.test(name) && !name.startsWith('01_')).length, real: readdirSync('bench/real').filter(name => /\.m?js$/.test(name) && name !== 'fetch.mjs').length, awfy: 14, game: 9, profile: 8};
                  const knownLodashFailure = detail => /does not provide an export named ['"]default['"]/.test(detail);
                  let startupExports = 0;
                  for (const suite of suites) {
                    const file = `${directory}/${suite}.json`;
                    if (!existsSync(file) || !existsSync(`${directory}/${suite}.md`)) { problems.push(`${suite}: missing JSON or Markdown report`); continue; }
                    const data = JSON.parse(readFileSync(file, 'utf8'));
                    if (data.info.runs !== 10 || data.info.scale !== 0.1 || data.info.runtimes.join(',') !== 'node,deno,bun,nona') problems.push(`${suite}: incomplete measurement protocol`);
                    problems.push(...data.mismatches.map(message => `${suite}: ${message}`));
                    for (const failure of data.failures) {
                      if (suite === 'real' && failure.startsWith('lodash on deno:') && knownLodashFailure(failure)) limitations.push(`${suite}: ${failure}`);
                      else problems.push(`${suite}: ${failure}`);
                    }
                    const entries = suite === 'awfy' ? data.results.benchmarks : data.results;
                    if (entries.length !== counts[suite]) problems.push(`${suite}: expected ${counts[suite]} cases, received ${entries.length}`);
                    for (const entry of entries) {
                      const name = entry.name ?? entry.script;
                      if (entry.build && !entry.build.ok || entry.error) problems.push(`${suite}/${name}: ${entry.error ?? entry.build.error}`);
                      if (suite === 'startup') {
                        if (entry.rows.length !== 5) problems.push(`startup/${name}: a runtime or compiled Bun row is missing`);
                        for (const row of entry.rows) {
                          if (!row.error) startupExports++;
                          if (name === 'lodash-hello' && row.label.startsWith('Deno') && row.error && knownLodashFailure(row.error)) limitations.push(`startup/${name}: ${row.error}`);
                          else if (row.error || row.startup.n !== 30) problems.push(`startup/${name}/${row.label}: ${row.error ?? 'expected 30 samples'}`);
                        }
                      } else if (suite === 'awfy') {
                        for (const runtime of data.info.runtimes) {
                          const sample = entry.runtimes[runtime];
                          if (sample?.rc !== 0 || sample.check !== true || sample.iterations?.length !== 10) problems.push(`awfy/${name}/${runtime}: failed verification or missing iterations`);
                        }
                      } else if (suite === 'profile') {
                        if (!(entry.node > 0 && entry.nona > 0)) problems.push(`profile/${name}: missing Node or Nona instruction count`);
                      } else {
                        for (const runtime of data.info.runtimes) {
                          const samples = entry.runs.filter(sample => sample.rt === runtime);
                          if (suite === 'real' && name === 'lodash' && runtime === 'deno' && samples.length === 1 && samples[0].rc !== 0 && knownLodashFailure(samples[0].stderr)) continue;
                          if (samples.length !== 10 || samples.some(sample => sample.rc !== 0)) problems.push(`${suite}/${name}/${runtime}: expected 10 successful samples`);
                        }
                      }
                    }
                  }
                  const rawStartup = `${directory}/hyperfine`;
                  if (!existsSync(rawStartup) || readdirSync(rawStartup).filter(name => name.endsWith('.json')).length !== startupExports) problems.push('startup: missing raw hyperfine sample exports');
                  for (const name of ['summary.md', 'ratios.json']) if (!existsSync(`${directory}/${name}`)) problems.push(`missing ${name}`);
                  for (const [generator, outcome] of [['load', process.env.HTTP_LOAD_OUTCOME], ['wrk', process.env.HTTP_WRK_OUTCOME]]) {
                    const file = `${directory}/http-${generator}.md`;
                    if (outcome !== 'success' || !existsSync(file)) { problems.push(`HTTP ${generator}: ${outcome}`); continue; }
                    const rows = readFileSync(file, 'utf8').split('\n').filter(line => /^\| (hello|json|headers|close|upload16k|big64k) \|/.test(line));
                    const validRow = row => {
                      const fields = row.split('|').slice(1, -1).map(value => value.trim());
                      return fields.length === 6 && fields.slice(1, 3).every(value => /^\d+(?:\.\d+)?k \(\d+(?:\.\d+)?k–\d+(?:\.\d+)?k\)$/.test(value) && Number.parseFloat(value) > 0) && /^×\d+(?:\.\d+)?$/.test(fields[3]) && Number(fields[3].slice(1)) > 0 && /^\d+(?:\.\d+)? \/ \d+(?:\.\d+)?$/.test(fields[4]) && /^\d+ \/ \d+$/.test(fields[5]) && fields[5].split(' / ').every(value => Number(value) > 0);
                    };
                    if (rows.length !== 18 || rows.some(row => !validRow(row))) problems.push(`HTTP ${generator}: incomplete or invalid result rows`);
                    const rawFile = `${directory}/http-${generator}.samples.jsonl`;
                    if (!existsSync(rawFile)) { problems.push(`HTTP ${generator}: raw generator evidence is missing`); continue; }
                    let samples;
                    try { samples = readFileSync(rawFile, 'utf8').trim().split('\n').filter(Boolean).map(line => JSON.parse(line)); }
                    catch { problems.push(`HTTP ${generator}: malformed raw generator evidence`); continue; }
                    if (samples.length !== 216) problems.push(`HTTP ${generator}: expected 216 invocations (36 cells, one warm-up and five measured runs each), received ${samples.length}`);
                    const cells = new Map();
                    let currentCell;
                    for (const sample of samples) {
                      if (sample.generator !== generator || sample.status !== 0 || sample.signal || sample.error || sample.stderr?.trim()) problems.push(`HTTP ${generator}: generator process failure or stderr: ${JSON.stringify(sample)}`);
                      if (!Array.isArray(sample.args) || typeof sample.stdout !== 'string') { problems.push(`HTTP ${generator}: invalid raw sample`); continue; }
                      const args = sample.args;
                      let port, connections, seconds, path, close, headers;
                      if (generator === 'load') {
                        [port, connections, seconds, path] = args;
                        close = args[4] === 'close';
                        headers = args[6] === 'headers';
                        const result = /^req\/s (\d+(?:\.\d+)?)\s+p50 (\d+(?:\.\d+)?) ms\s+p99 (\d+(?:\.\d+)?) ms\s+errors (\d+)\s*$/.exec(sample.stdout);
                        if (!result || Number(result[1]) <= 0 || Number(result[4]) !== 0) problems.push('HTTP load: missing throughput or nonzero request errors');
                      } else {
                        connections = args.find(value => /^-c\d+$/.test(value))?.slice(2);
                        seconds = args.find(value => /^-d\d+s$/.test(value))?.slice(2, -1);
                        const url = args.find(value => value.startsWith('http://127.0.0.1:'));
                        if (!url) { problems.push('HTTP wrk: missing benchmark URL'); continue; }
                        const endpoint = new URL(url);
                        port = endpoint.port;
                        path = endpoint.pathname;
                        close = args.includes('Connection: close');
                        headers = args.some(value => value.startsWith('User-Agent:'));
                        const throughput = /Requests\/sec:\s*([\d.]+)/.exec(sample.stdout);
                        const socketErrors = /^\s*Socket errors:([^\n]*)/m.exec(sample.stdout);
                        const responseErrors = /Non-2xx or 3xx responses:\s*(\d+)/.exec(sample.stdout);
                        if (!throughput || !(Number(throughput[1]) > 0) || socketErrors && (socketErrors[1].match(/\d+/g) ?? ['1']).some(value => Number(value) > 0) || responseErrors && Number(responseErrors[1]) > 0) problems.push('HTTP wrk: missing throughput, socket errors or non-success responses');
                      }
                      const name = path === '/json' ? 'json' : path === '/upload' ? 'upload16k' : path === '/big' ? 'big64k' : path === '/headers' ? 'headers' : path === '/' ? close ? 'close' : 'hello' : null;
                      if (!name || ![1, 32, 256].includes(Number(connections)) || ![2, 3].includes(Number(seconds)) || !/^\d+$/.test(port ?? '')) { problems.push(`HTTP ${generator}: unexpected workload arguments`); continue; }
                      if (name === 'headers' && !headers || name === 'upload16k' && (generator === 'load' ? Number(args[5]) !== 16384 : !args.includes('upload.lua'))) problems.push(`HTTP ${generator}: missing headers or upload body workload`);
                      const prefix = `${name}/${connections}/${port}/`;
                      if (Number(seconds) === 2) {
                        if (sample.preflight?.ok !== true || sample.preflight.status !== 200) problems.push(`HTTP ${generator}/${name}: response preflight failed`);
                        currentCell = prefix + cells.size;
                      }
                      if (!currentCell?.startsWith(prefix)) { problems.push(`HTTP ${generator}: measured sample has no matching warm-up`); continue; }
                      const cell = cells.get(currentCell) ?? [];
                      cell.push(Number(seconds));
                      cells.set(currentCell, cell);
                    }
                    for (const name of ['hello', 'json', 'headers', 'close', 'upload16k', 'big64k']) for (const connections of [1, 32, 256]) {
                      const pair = [...cells].filter(([key]) => key.startsWith(`${name}/${connections}/`));
                      if (pair.length !== 2 || pair.some(([, durations]) => durations.length !== 6 || durations.filter(value => value === 2).length !== 1 || durations.filter(value => value === 3).length !== 5)) problems.push(`HTTP ${generator}/${name}/${connections}: both runtime cells need one warm-up and five measured samples`);
                    }
                  }
                  if (process.env.REPORT_OUTCOME !== 'success') problems.push(`report command: ${process.env.REPORT_OUTCOME}`);
                  const status = problems.length ? 'incomplete-or-failed' : limitations.length ? 'complete-with-documented-limitations' : 'complete';
                  const result = {status, problems, limitations};
                  writeFileSync(`${directory}/validation.json`, JSON.stringify(result, null, 2));
                  const summary = `Benchmark status: **${status}**\n\n${problems.map(message => `- Failure: ${message}`).join('\n')}\n${limitations.map(message => `- Documented Deno/lodash limitation: ${message}`).join('\n')}\n`;
                  appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary);
                  console.log(summary);
                  if (problems.length) process.exitCode = 1;
                  JS
            - name: Retain benchmark evidence, including partial failures
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: release-benchmark-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
                  retention-days: 90
                  if-no-files-found: error
                  path: |
                      work/release-benchmark
                      bench/build/profile-*.json
