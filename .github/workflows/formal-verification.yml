name: formal-verification
on:
    push:
        branches: [main]
    pull_request:

permissions:
    contents: read

concurrency:
    # A pull request has one group (head_ref): a newer push cancels the older
    # run. A push to main has one group per commit (sha), so the next merge
    # does not cancel the check of the previous one (#42).
    group: ${{ github.workflow }}-${{ github.repository }}-${{ github.head_ref || github.sha }}
    cancel-in-progress: true

jobs:
    move-regressions:
        # Keep proof-correspondence executions on hosted Windows and Linux,
        # including the compact liveness representation and real GC stress.
        strategy:
            fail-fast: false
            max-parallel: 1
            matrix:
                os: [ubuntu-latest, windows-latest]
                pinned: ["256", "0"]
        runs-on: ${{ matrix.os }}
        steps:
            - uses: actions/checkout@v4
            - name: Record exact checked revision
              run: git rev-parse HEAD
            - uses: actions/setup-node@v4
              with:
                  node-version: "26.9.0"
                  cache: npm
            - run: npm ci
            - run: npm run build
            - name: Production move and liveness regressions with GC stress
              run: node --test --test-concurrency=1 dist/tests/ir-move-rules.test.js dist/tests/liveness.test.js dist/tests/ir-optimizations.test.js
              env:
                  NONA_PINNED_LOCALS: ${{ matrix.pinned }}
                  NONA_GC_STRESS: "on"
            - name: Production move and liveness regressions without GC stress
              run: node --test --test-concurrency=1 dist/tests/ir-move-rules.test.js dist/tests/liveness.test.js dist/tests/ir-optimizations.test.js
              env:
                  NONA_PINNED_LOCALS: ${{ matrix.pinned }}
                  NONA_GC_STRESS: "off"
    lean:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - name: Record exact checked revision
              run: git rev-parse HEAD
            # lean-action downloads elan and the toolchain once, without
            # retries, so a transient TLS error from releases.lean-lang.org
            # fails the job. Install both here with retries; lean-action then
            # finds the toolchain already installed.
            - name: Install elan and the Lean toolchain
              working-directory: verification
              run: |
                  retry() {
                      for attempt in 1 2 3 4 5; do
                          "$@" && return 0
                          echo "attempt $attempt failed: $*" >&2
                          sleep $((attempt * 10))
                      done
                      return 1
                  }
                  retry curl -sSfL -o "$RUNNER_TEMP/elan-init.sh" \
                      https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh
                  retry sh "$RUNNER_TEMP/elan-init.sh" -y --default-toolchain none
                  retry "$HOME/.elan/bin/elan" toolchain install "$(cat lean-toolchain)"
                  "$HOME/.elan/bin/lean" --version
            - uses: leanprover/lean-action@a1e4f67744f24ab80ec3c7ab1bd37d7d419207d5
              with:
                  lake-package-directory: verification
                  auto-config: "false"
                  build: "true"
                  test: "false"
                  lint: "false"
                  use-mathlib-cache: "false"
