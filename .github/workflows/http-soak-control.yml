name: http soak control

on:
    pull_request:
        paths:
            - "scripts/http-soak*.mjs"
            - "scripts/fixtures/http-soak*.mjs"
            - "bench/http/soak-server.mjs"
            - ".github/workflows/http-soak*.yml"
            - "docs/network.md"
            - "bench/README.md"
            - "package.json"
            - "package-lock.json"
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: http-soak-control-${{ github.repository }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

jobs:
    node-control:
        # Literal hosted runners; never use the repository's overflow router.
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, windows-latest]
        runs-on: ${{ matrix.os }}
        timeout-minutes: 8
        env:
            EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: ${{ env.EXPECTED_HEAD }}
                  persist-credentials: false
            - uses: actions/setup-node@v4
              with:
                  node-version: "26.9.0"
            - name: Verify exact head and hosted runner
              shell: bash
              run: |
                  test "$RUNNER_ENVIRONMENT" = github-hosted
                  test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
            - name: Provision pinned inert soak source
              shell: bash
              timeout-minutes: 1
              run: |
                  node --input-type=module <<'NODE'
                  import assert from "node:assert/strict";
                  import { createHash } from "node:crypto";
                  import { appendFileSync, mkdirSync, writeFileSync } from "node:fs";
                  import { resolve } from "node:path";
                  const response = await fetch("https://raw.githubusercontent.com/40oleg/nona/ab5ea083d793e0a665fde8b0a4b33bc1fa67208e/scripts/http-soak.mjs", {
                      redirect: "error",
                      signal: AbortSignal.timeout(20000),
                  });
                  assert.ok(response.ok, `pinned source HTTP ${response.status}`);
                  const chunks = [];
                  let length = 0;
                  for await (const chunk of response.body) {
                      length += chunk.length;
                      assert.ok(length <= 28490, "pinned source exceeds byte limit");
                      chunks.push(chunk);
                  }
                  assert.equal(length, 28490, "pinned source length changed");
                  const bytes = Buffer.concat(chunks);
                  assert.equal(createHash("sha256").update(bytes).digest("hex"), "31be9600805b228135b665969320e4554c6f95236e6bb85f55f8116b2678f47d", "pinned source SHA256 changed");
                  mkdirSync("soak-control-report", { recursive: true });
                  const fixture = resolve("soak-control-report/http-soak.ab5.mjs");
                  writeFileSync(fixture, bytes);
                  appendFileSync(process.env.GITHUB_ENV, `LATENCY615_TEST_INPUT=${fixture}\n`);
                  NODE
            - name: Cheap decision and report regressions
              run: node --test --test-concurrency=1 scripts/http-soak.test.mjs scripts/http-soak-completion.test.mjs scripts/http-soak-smoke-policy.test.mjs scripts/http-soak-check.test.mjs
            - name: Real Node control and failure fixtures (no native compilation)
              run: node --test --test-concurrency=1 scripts/http-soak-hosted.test.mjs
            - uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: http-soak-control-${{ matrix.os }}-${{ env.EXPECTED_HEAD }}
                  path: soak-control-report/
                  if-no-files-found: warn
                  retention-days: 30
