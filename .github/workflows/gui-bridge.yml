name: GUI window bridge
on:
    pull_request:
        paths:
            - "src/**"
            - "tests/gui-bridge.test.ts"
            - "tests/gui-elements.test.ts"
            - "tests/gui-controls.test.ts"
            - "tests/child-process-fairness.test.ts"
            - "tests/helpers/gui-native.ts"
            - "tests/helpers/gui-render-native.ts"
            - "tests/helpers/gui-controls-native.ts"
            - "tests/fixtures/gui-window.mjs"
            - "tests/fixtures/gui/**"
            - "package*.json"
            - ".github/workflows/gui-bridge.yml"
    workflow_dispatch:
permissions:
    contents: read
concurrency:
    group: gui-bridge-${{ github.ref }}
    cancel-in-progress: true
jobs:
    window-bridge:
        runs-on: ubuntu-24.04
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: "26.9.0"
                  cache: npm
            - name: Install real GTK and isolated X11 display
              run: |
                  test '${{ runner.environment }}' = github-hosted
                  sudo apt-get update -qq
                  sudo apt-get install -y libgtk-4-1 libpangoft2-1.0-0 xvfb xauth dbus-x11 python3-pyatspi at-spi2-core xdotool
            - run: npm ci
            - run: npm run build
            - name: Record environment
              run: |
                  mkdir -p work/gui-evidence
                  { cat /etc/os-release; uname -m; dpkg-query -W libgtk-4-1 libglib2.0-0t64; git rev-parse HEAD; } > work/gui-evidence/environment.txt
            - name: Run focused bridge tests and real window in both compiler GC modes
              env:
                  NONA_GTK_GUI_TESTS: "1"
                  NONA_GTK_INPUT_TESTS: "1"
                  GTK_A11Y: atspi
                  LC_ALL: C.UTF-8
                  NONA_GC_STRESS: "on"
                  NONA_EXECUTION_EVIDENCE: work/gui-evidence/executions
                  GDK_BACKEND: x11
                  GDK_SCALE: "1"
                  WAYLAND_DISPLAY: ""
                  GSK_RENDERER: cairo
              run: |
                  set -o pipefail
                  timeout 10m xvfb-run -a dbus-run-session -- node --test --test-concurrency=1 dist/tests/child-process-fairness.test.js dist/tests/gui-bridge.test.js dist/tests/gui-elements.test.js dist/tests/gui-controls.test.js 2>&1 | tee work/gui-evidence/tests.txt
            - name: Retain console ELF direct dependencies and headless output
              run: |
                  printf "console.log('headless console');\n" > work/gui-evidence/console.js
                  node dist/cli.js build work/gui-evidence/console.js --target linux-x64 -o work/gui-evidence/console
                  readelf -d work/gui-evidence/console > work/gui-evidence/console.dynamic.txt
                  ! grep -q '(NEEDED)' work/gui-evidence/console.dynamic.txt
                  env -u DISPLAY -u WAYLAND_DISPLAY work/gui-evidence/console > work/gui-evidence/console.stdout.txt
            - uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: gui-window-bridge
                  path: work/gui-evidence
