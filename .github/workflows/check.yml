name: check
on:
  push:
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26.9.0'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run compare
      - uses: actions/checkout@v4
        with:
          repository: tc39/test262
          ref: 7ab7fafa0003f73fc85c1b95d88094d33f7eb8bd
          path: work/test262
          sparse-checkout: |
            harness
            test/language/expressions/coalesce
            test/language/expressions/arrow-function
            test/language/expressions/array
            test/language/expressions/call
            test/language/expressions/new
            test/language/expressions/generators
            test/language/expressions/tagged-template
            test/language/expressions/template-literal
            test/language/rest-parameters
            test/language/statements/for-in
            test/language/statements/for-of
            test/language/statements/function
            test/built-ins/Symbol
            test/built-ins/Array/prototype/includes
            test/built-ins/Array/prototype/concat
            test/built-ins/Array/prototype/flat
            test/built-ins/Array/prototype/flatMap
            test/built-ins/Array/prototype/toLocaleString
            test/built-ins/Array/prototype/sort
            test/built-ins/Array/prototype/Symbol.unscopables
            test/built-ins/Array/prototype/values
            test/built-ins/Array/prototype/indexOf
            test/built-ins/Array/prototype/lastIndexOf
            test/built-ins/Array/prototype/forEach
            test/built-ins/Array/prototype/map
            test/built-ins/Array/prototype/some
            test/built-ins/Array/prototype/every
            test/built-ins/Array/prototype/find
            test/built-ins/Array/prototype/findIndex
            test/built-ins/Array/prototype/reduce
            test/built-ins/Array/prototype/reduceRight
            test/built-ins/Array/prototype/fill
            test/built-ins/Array/prototype/copyWithin
            test/built-ins/Array/prototype/reverse
            test/built-ins/Array/prototype/shift
            test/built-ins/Array/prototype/unshift
            test/built-ins/Array/prototype/pop
            test/built-ins/Math/pow
            test/built-ins/Math/abs
            test/built-ins/Math/ceil
            test/built-ins/Math/floor
            test/built-ins/Math/round
            test/built-ins/Math/sign
            test/built-ins/Math/sqrt
            test/built-ins/Math/trunc
            test/built-ins/Math/sin
            test/built-ins/Math/cos
            test/built-ins/Math/tan
            test/built-ins/Math/log
            test/built-ins/Math/log2
            test/built-ins/Math/log10
            test/built-ins/Math/log1p
            test/built-ins/Math/cbrt
            test/built-ins/Math/asin
            test/built-ins/Math/acos
            test/built-ins/Math/atanh
            test/built-ins/Math/asinh
            test/built-ins/Math/acosh
            test/built-ins/Math/sinh
            test/built-ins/Math/cosh
            test/built-ins/Math/tanh
            test/built-ins/encodeURI
            test/built-ins/encodeURIComponent
            test/built-ins/decodeURI
            test/built-ins/decodeURIComponent
            test/built-ins/Math/exp
            test/built-ins/Math/expm1
            test/built-ins/Math/atan
            test/built-ins/Math/atan2
            test/built-ins/Number/isFinite
            test/built-ins/Number/isInteger
            test/built-ins/Number/isNaN
            test/built-ins/Number/isSafeInteger
            test/built-ins/Number/parseInt.js
            test/built-ins/Number/parseFloat.js
            test/built-ins/parseInt
            test/built-ins/parseFloat
            test/built-ins/String/fromCharCode
            test/built-ins/String/fromCodePoint
            test/built-ins/String/raw
            test/built-ins/String/prototype/concat
            test/built-ins/String/prototype/toUpperCase
            test/built-ins/String/prototype/toLowerCase
            test/built-ins/String/prototype/toLocaleLowerCase
            test/built-ins/String/prototype/toLocaleUpperCase
            test/built-ins/String/prototype/split
            test/built-ins/String/prototype/replace
            test/built-ins/Number/prototype/toFixed
            test/built-ins/Number/prototype/toExponential
            test/built-ins/Number/prototype/toPrecision
            test/built-ins/String/prototype/includes
            test/built-ins/String/prototype/indexOf
            test/built-ins/String/prototype/lastIndexOf
            test/built-ins/String/prototype/padEnd
            test/built-ins/String/prototype/padStart
      - run: npm run test262:smoke
  linux-native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26.9.0'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node --test dist/tests/frontend.test.js dist/tests/lowering.test.js dist/tests/liveness.test.js dist/tests/elf.test.js dist/tests/object-annexb.test.js dist/tests/async.test.js dist/tests/with.test.js dist/tests/modules.test.js dist/tests/tail-calls.test.js dist/tests/dynamic-functions.test.js dist/tests/language-audit.test.js
      - run: npm run compare:linux
      - uses: actions/checkout@v4
        with:
          repository: tc39/test262
          ref: 7ab7fafa0003f73fc85c1b95d88094d33f7eb8bd
          path: work/test262
          sparse-checkout: |
            harness
            test/built-ins/Object/prototype
      - run: node scripts/test262-smoke.mjs built-ins/Object/prototype
        env:
          TEST262_JOBS: '4'
          TEST262_RUNTIME_TIMEOUT_MS: '120000'
          TEST262_PATH_FILTER: '/__'
          TEST262_EXCLUDE_PATH_FILTER: '/__proto__/'
          TEST262_REPORT: 'work/test262-object-annexb-linux-report.json'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test262-object-annexb-linux-report
          path: work/test262-object-annexb-linux-report.json
          if-no-files-found: ignore
  windows-reflect-test262:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26.9.0'
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/checkout@v4
        with:
          repository: tc39/test262
          ref: 7ab7fafa0003f73fc85c1b95d88094d33f7eb8bd
          path: work/test262
          sparse-checkout: |
            harness
            test/built-ins/Reflect
      - run: node scripts/test262-smoke.mjs built-ins/Reflect
        env:
          TEST262_JOBS: '4'
          TEST262_RUNTIME_TIMEOUT_MS: '120000'
          TEST262_EXCLUDE_PATH_FILTER: 'arguments-list-is-not-array-like-but-still-valid.js'
          TEST262_REPORT: 'work/test262-reflect-report.json'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test262-reflect-report
          path: work/test262-reflect-report.json
          if-no-files-found: ignore
  windows-promise-test262:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26.9.0'
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/checkout@v4
        with:
          repository: tc39/test262
          ref: 7ab7fafa0003f73fc85c1b95d88094d33f7eb8bd
          path: work/test262
          sparse-checkout: |
            harness
            test/built-ins/Promise
      - run: node scripts/test262-smoke.mjs built-ins/Promise
        env:
          TEST262_JOBS: '4'
          TEST262_RUN_ASYNC: '1'
          TEST262_RUNTIME_TIMEOUT_MS: '120000'
          TEST262_EXCLUDE_PATH_FILTERS: 'built-ins/Promise/any/,built-ins/Promise/allKeyed/,built-ins/Promise/allSettledKeyed/,built-ins/Promise/try/,built-ins/Promise/withResolvers/,ctx-non-ctor.js,proto-from-ctor-realm.js'
          TEST262_REPORT: 'work/test262-promise-report.json'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test262-promise-report
          path: work/test262-promise-report.json
          if-no-files-found: ignore
  windows-typedarray-test262:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26.9.0'
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/checkout@v4
        with:
          repository: tc39/test262
          ref: 7ab7fafa0003f73fc85c1b95d88094d33f7eb8bd
          path: work/test262
          sparse-checkout: |
            harness
            test/built-ins/TypedArray
      - run: node scripts/test262-smoke.mjs built-ins/TypedArray
        env:
          TEST262_JOBS: '4'
          TEST262_RUNTIME_TIMEOUT_MS: '600000'
          TEST262_EXCLUDE_PATH_FILTERS: '/prototype/at/,/prototype/findLast/,/prototype/findLastIndex/,/prototype/toReversed/,/prototype/toSorted/,/prototype/with/'
          TEST262_EXCLUDE_FEATURES: 'resizable-arraybuffer,immutable-arraybuffer'
          TEST262_REPORT: 'work/test262-typedarray-report.json'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test262-typedarray-report
          path: work/test262-typedarray-report.json
          if-no-files-found: ignore
  windows-dataview-test262:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26.9.0'
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/checkout@v4
        with:
          repository: tc39/test262
          ref: 7ab7fafa0003f73fc85c1b95d88094d33f7eb8bd
          path: work/test262
          sparse-checkout: |
            harness
            test/built-ins/DataView
      - run: node scripts/test262-smoke.mjs built-ins/DataView
        env:
          TEST262_JOBS: '4'
          TEST262_RUNTIME_TIMEOUT_MS: '120000'
          TEST262_EXCLUDE_PATH_FILTERS: '/prototype/getFloat16/,/prototype/setFloat16/,proto-from-ctor-realm'
          TEST262_EXCLUDE_FEATURES: 'resizable-arraybuffer,immutable-arraybuffer'
          TEST262_REPORT: 'work/test262-dataview-report.json'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test262-dataview-report
          path: work/test262-dataview-report.json
          if-no-files-found: ignore
  windows-arraybuffer-test262:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26.9.0'
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/checkout@v4
        with:
          repository: tc39/test262
          ref: 7ab7fafa0003f73fc85c1b95d88094d33f7eb8bd
          path: work/test262
