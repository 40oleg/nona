      - run: node scripts/test262-smoke.mjs built-ins/JSON
        env:
          TEST262_JOBS: '4'
          TEST262_RUNTIME_TIMEOUT_MS: '120000'
          TEST262_EXCLUDE_PATH_FILTERS: '/isRawJSON/,/rawJSON/,replacer-array-proxy-revoked-realm.js,value-bigint-cross-realm.js'
          TEST262_EXCLUDE_FEATURES: 'json-parse-with-source'
          TEST262_REPORT: 'work/test262-json-report.json'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test262-json-report
          path: work/test262-json-report.json
          if-no-files-found: ignore
