            harness
            test/built-ins/Date
      - run: node scripts/test262-smoke.mjs built-ins/Date
        env:
          TEST262_JOBS: '4'
          TEST262_RUNTIME_TIMEOUT_MS: '120000'
          TEST262_EXCLUDE_PATH_FILTERS: '/prototype/toTemporalInstant/,proto-from-ctor-realm'
