name: check
env:
    NODE_VERSION: "26.9.0"
    # tc39/test262 revision; scripts/test262-smoke.mjs pins the same one.
    TEST262_REF: 7ab7fafa0003f73fc85c1b95d88094d33f7eb8bd
on:
    # Branch pushes are checked by their pull request; a second push run in the
    # same concurrency group would only cancel or be cancelled by it.
    push:
        branches: [main]
    pull_request:
concurrency:
    # A pull request has one group (head_ref): a newer push cancels the older
    # run. A push to main has one group per commit (sha), so the next merge
    # does not cancel the check of the previous one (#42).
    group: ${{ github.workflow }}-${{ github.repository }}-${{ github.head_ref || github.sha }}
    cancel-in-progress: true
jobs:
    route:
        # Where the Windows jobs run: GitHub-hosted windows-latest, or the
        # owner's self-hosted Windows runner when hosted Windows jobs already
        # wait in the queue and that runner is online and idle. Forks always
        # stay hosted (scripts/pick-runner.mjs, docs/ci-runners.md).
        runs-on: ubuntu-latest
        permissions:
            contents: read
            actions: read
        outputs:
            windows: ${{ steps.pick.outputs.runner }}
        steps:
            - uses: actions/checkout@v4
              with:
                  sparse-checkout: scripts/pick-runner.mjs
                  sparse-checkout-cone-mode: false
            - id: pick
              run: node scripts/pick-runner.mjs
              env:
                  GITHUB_TOKEN: ${{ github.token }}
                  RUNNER_STATUS_TOKEN: ${{ secrets.RUNNER_STATUS_TOKEN }}
                  TRUSTED: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    changes:
        # Whether this run needs the Test262 directory jobs (#371,
        # scripts/ci-changes.mjs): always on main and manual runs; on a pull
        # request when it changes src/, the Test262 runner, package files or
        # this workflow, or has the full-ci label.
        runs-on: ubuntu-latest
        permissions:
            contents: read
            pull-requests: read
        outputs:
            test262: ${{ steps.decide.outputs.test262 }}
        steps:
            - uses: actions/checkout@v4
              with:
                  sparse-checkout: scripts/ci-changes.mjs
                  sparse-checkout-cone-mode: false
            - id: decide
              run: node scripts/ci-changes.mjs
              env:
                  GITHUB_TOKEN: ${{ github.token }}
                  PR_NUMBER: ${{ github.event.pull_request.number }}
                  FULL_CI: ${{ contains(github.event.pull_request.labels.*.name, 'full-ci') }}
    format:
        # Sources are formatted with Prettier (#250): npm run format fixes them.
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: npm
            - run: npm ci
            - run: npm run format:check
    windows:
        # The Windows test files in four shards balanced by tests/timings.json
        # (scripts/run-shard.mjs, #370). program-corpus* runs in the program
        # corpus workflow, on Windows too.
        name: windows (${{ matrix.shard }}/4)
        needs: route
        runs-on: ${{ fromJSON(needs.route.outputs.windows) }}
        strategy:
            fail-fast: false
            matrix:
                shard: [1, 2, 3, 4]
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: npm
            - run: npm ci
            - run: npm run build
            - run: node scripts/run-shard.mjs --shard ${{ matrix.shard }}/4 --exclude "program-corpus*" --timings-out work/test-timings-${{ matrix.shard }}.json
              env:
                  # Pull requests: GC stress only for tests/gc-stress.json
                  # unless the gc-stress label is set; main: everything (#372).
                  NONA_GC_STRESS_SCOPE: ${{ github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'gc-stress') && 'marked' || 'all' }}
            - run: node scripts/test-timings.mjs work/test-timings-${{ matrix.shard }}*.json
              if: always()
              shell: bash
            - uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: windows-test-timings-${{ matrix.shard }}
                  path: work/test-timings-${{ matrix.shard }}*.json
                  if-no-files-found: ignore
    windows-compare:
        # Oracle comparison and the Test262 smoke manifest on Windows.
        needs: route
        runs-on: ${{ fromJSON(needs.route.outputs.windows) }}
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: npm
            - run: npm ci
            - name: Record isolated Windows Node abort behavior
              # It changes the Windows Error Reporting settings of the machine.
              if: runner.environment == 'github-hosted'
              shell: pwsh
              run: ./scripts/process-abort-oracle.ps1
            - run: npm run build
            - run: node scripts/compare.mjs
            - uses: actions/checkout@v4
              with:
                  repository: tc39/test262
                  ref: ${{ env.TEST262_REF }}
                  path: work/test262
                  # Directories that hold the tests listed in tests/test262-smoke.json.
                  sparse-checkout: |
                      harness
                      test/language/expressions/coalesce
                      test/language/expressions/arrow-function
                      test/language/expressions/array
                      test/language/expressions/call
                      test/language/expressions/new
                      test/language/expressions/generators
                      test/language/expressions/tagged-template
                      test/language/expressions/template-literal
                      test/language/rest-parameters
                      test/language/statements/for-in
                      test/language/statements/for-of
                      test/language/statements/function
                      test/built-ins/Symbol
                      test/built-ins/Iterator
                      test/built-ins/Array/prototype
                      test/built-ins/Math
                      test/built-ins/Number
                      test/built-ins/String
                      test/built-ins/parseInt
                      test/built-ins/parseFloat
                      test/built-ins/encodeURI
                      test/built-ins/encodeURIComponent
                      test/built-ins/decodeURI
                      test/built-ins/decodeURIComponent
                      test/intl402/Number/prototype
                      test/intl402/String/prototype
                      test/intl402/Date/prototype
            - run: node scripts/test262-smoke.mjs
    linux-native:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: npm
            - run: npm ci
            - run: npm run build
            - run: node scripts/run-suite.mjs frontend elf async events
            - run: node scripts/run-suite.mjs path
            - run: npm run compare:linux
            - uses: actions/checkout@v4
              with:
                  repository: tc39/test262
                  ref: ${{ env.TEST262_REF }}
                  path: work/test262
                  sparse-checkout: |
                      harness
                      test/built-ins/Object/prototype
            - run: node scripts/test262-smoke.mjs built-ins/Object/prototype
              env:
                  TEST262_JOBS: "4"
                  TEST262_RUNTIME_TIMEOUT_MS: "120000"
                  TEST262_PATH_FILTER: "/__"
                  TEST262_EXCLUDE_PATH_FILTER: "/__proto__/"
                  TEST262_REPORT: "work/test262-object-annexb-linux-report.json"
            - uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: test262-object-annexb-linux-report
                  path: work/test262-object-annexb-linux-report.json
                  if-no-files-found: ignore
    windows-test262:
        # Same job names and report artifacts as the former per-directory jobs.
        name: windows-${{ matrix.group }}-test262
        needs: changes
        if: needs.changes.outputs.test262 == 'true'
        runs-on: windows-latest
        strategy:
            fail-fast: false
            matrix:
                include:
                    - group: reflect
                      dir: built-ins/Reflect
                      exclude-paths: "arguments-list-is-not-array-like-but-still-valid.js"
                    - group: promise
                      dir: built-ins/Promise
                      run-async: "1"
                      exclude-paths: "built-ins/Promise/any/,built-ins/Promise/allKeyed/,built-ins/Promise/allSettledKeyed/,built-ins/Promise/try/,built-ins/Promise/withResolvers/,ctx-non-ctor.js,proto-from-ctor-realm.js"
                    - group: typedarray
                      dir: built-ins/TypedArray
                      timeout: "600000"
                      exclude-paths: "/prototype/at/,/prototype/findLast/,/prototype/findLastIndex/,/prototype/toReversed/,/prototype/toSorted/,/prototype/with/"
                      exclude-features: "resizable-arraybuffer,immutable-arraybuffer"
                    - group: dataview
                      dir: built-ins/DataView
                      exclude-paths: "/prototype/getFloat16/,/prototype/setFloat16/,proto-from-ctor-realm"
                      exclude-features: "resizable-arraybuffer,immutable-arraybuffer"
                    - group: arraybuffer
                      dir: built-ins/ArrayBuffer
                      exclude-paths: "/prototype/detached/,/prototype/immutable/,/prototype/maxByteLength/,/prototype/resizable/,/prototype/resize/,/prototype/sliceToImmutable/,/prototype/transfer/,/prototype/transferToFixedLength/,/prototype/transferToImmutable/,proto-from-ctor-realm.js"
                      exclude-features: "resizable-arraybuffer,immutable-arraybuffer"
                    - group: sharedarraybuffer
                      dir: built-ins/SharedArrayBuffer
                      exclude-paths: "/prototype/grow/,/prototype/growable/,/prototype/maxByteLength/,options-maxbytelength-,options-non-object.js,proto-from-ctor-realm.js"
                      exclude-features: "growable-sharedarraybuffer,resizable-arraybuffer,immutable-arraybuffer"
                    - group: date
                      dir: built-ins/Date
                      exclude-paths: "/prototype/toTemporalInstant/,proto-from-ctor-realm"
                    - group: json
                      dir: built-ins/JSON
                      exclude-paths: "/isRawJSON/,/rawJSON/,replacer-array-proxy-revoked-realm.js,value-bigint-cross-realm.js"
                      exclude-features: "json-parse-with-source"
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: npm
            - run: npm ci
            - run: npm run build
            - uses: actions/checkout@v4
              with:
                  repository: tc39/test262
                  ref: ${{ env.TEST262_REF }}
                  path: work/test262
                  sparse-checkout: |
                      harness
                      test/${{ matrix.dir }}
            - run: node scripts/test262-smoke.mjs ${{ matrix.dir }}
              env:
                  TEST262_JOBS: "4"
                  TEST262_RUN_ASYNC: ${{ matrix.run-async || '' }}
                  TEST262_RUNTIME_TIMEOUT_MS: ${{ matrix.timeout || '120000' }}
                  TEST262_EXCLUDE_PATH_FILTERS: ${{ matrix.exclude-paths }}
                  TEST262_EXCLUDE_FEATURES: ${{ matrix.exclude-features || '' }}
                  TEST262_REPORT: work/test262-${{ matrix.group }}-report.json
            - uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: test262-${{ matrix.group }}-report
                  path: work/test262-${{ matrix.group }}-report.json
                  if-no-files-found: ignore
