name: native-platforms
env:
    NODE_VERSION: "26.9.0"
on:
    push:
        branches: [main]
    workflow_dispatch:
        inputs:
            diagnostic_mode:
                description: Optional isolated diagnostic; full preserves the normal platform jobs
                type: choice
                options: [full, startup-602, env-602, http602-current]
                default: full
                required: false
            diagnostic_sha:
                description: Exact reviewed temporary issue-602-startup-* commit (diagnostic modes only)
                type: string
                required: false
    # On a pull request only the browser compiler runs; the platform jobs run
    # when the PR has the full-ci label (#353). "labeled" starts them once the
    # label is added.
    pull_request:
        types: [opened, synchronize, reopened, labeled]
permissions:
    contents: read
concurrency:
    # A pull request has one group (head_ref): a newer push cancels the older
    # run. On main the group is the branch and nothing is cancelled: the
    # running build finishes and a newer merge replaces the pending one, so a
    # burst of merges is checked once, on its last commit (#353). check.yml
    # still checks every commit of main (#42).
    # These two diagnostics use unique groups and cannot evict another mode.
    group: ${{ inputs.diagnostic_mode == 'http602-current' && format('native-platforms-http602-current-{0}-{1}', github.run_id, github.run_attempt) || inputs.diagnostic_mode == 'env-602' && format('native-platforms-env602-{0}-{1}', github.run_id, github.run_attempt) || format('native-platforms-{0}', github.event_name == 'pull_request' && github.head_ref || github.ref) }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
    browser-compiler:
        if: inputs.diagnostic_mode != 'startup-602' && inputs.diagnostic_mode != 'env-602' && inputs.diagnostic_mode != 'http602-current'
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: npm
                  cache-dependency-path: |
                      package-lock.json
                      site/package-lock.json
            - run: npm ci
            - run: npm run build
            - run: npm ci
              working-directory: site
            - run: npm run build
              working-directory: site
            - run: npm run check:playground
              working-directory: site
            - run: npm run check:samples
              working-directory: site
            - run: npm run check:links
              working-directory: site
    windows-regression:
        name: Windows x64 full regression (manual)
        # check.yml runs the full Windows x64 suite on PRs and main. Keep it here
        # for manually dispatched full-platform runs as well.
        if: inputs.diagnostic_mode != 'startup-602' && inputs.diagnostic_mode != 'env-602' && inputs.diagnostic_mode != 'http602-current' && github.event_name == 'workflow_dispatch'
        runs-on: windows-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: npm
            - run: npm ci
            - run: npm run check
            - run: npm run compare
    linux-regression:
        name: Linux x64 compiler and example regression
        if: inputs.diagnostic_mode != 'startup-602' && inputs.diagnostic_mode != 'env-602' && inputs.diagnostic_mode != 'http602-current' && (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci'))
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: npm
            - run: npm ci
            - run: npm run build
            - run: node scripts/run-suite.mjs elf native-formats
            - run: npm run compare:linux
    loaders:
        name: ${{ matrix.target }} native and portable suites
        if: inputs.diagnostic_mode != 'startup-602' && inputs.diagnostic_mode != 'env-602' && inputs.diagnostic_mode != 'http602-current' && (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci'))
        strategy:
            fail-fast: false
            matrix:
                include:
                    - { runner: ubuntu-24.04, target: linux-x64 }
                    - { runner: ubuntu-24.04-arm, target: linux-arm64 }
                    - { runner: macos-15-intel, target: darwin-x64 }
                    - { runner: macos-15, target: darwin-arm64 }
                    - { runner: windows-11-arm, target: win32-arm64 }
        runs-on: ${{ matrix.runner }}
        env:
            # GC stress and compilation share this hosted ARM runner. Keep the
            # full suites while limiting simultaneous test-file processes.
            NONA_TEST_CONCURRENCY: ${{ matrix.target == 'win32-arm64' && '2' || '' }}
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: npm
            - run: npm ci
            - run: npm run build
            - name: Isolated Windows ARM64 rejected-promise inspection oracle
              if: matrix.target == 'win32-arm64'
              run: >-
                  node --test --test-concurrency=1
                  --test-name-pattern="util.inspect does not mark a rejected promise as handled"
                  dist/tests/util-inspect-promise.test.js
            - name: Build native probes
              run: node scripts/build-platform-probes.mjs work/platform-probes ${{ matrix.target }}
            - name: Record isolated Windows Node abort behavior
              if: matrix.target == 'win32-arm64'
              shell: pwsh
              run: ./scripts/process-abort-oracle.ps1
            - name: Execute native loader and runtime probes
              if: matrix.target == 'win32-arm64'
              run: node scripts/run-platform-probes.mjs ${{ matrix.target }}
            - name: Record Node process signal behavior
              if: matrix.target != 'win32-arm64'
              run: node scripts/process-signals-oracle.mjs
            - name: Execute native POSIX loader and runtime probes
              if: matrix.target != 'win32-arm64'
              shell: bash
              run: |
                  ulimit -c 0
                  node scripts/run-platform-probes.mjs ${{ matrix.target }}
            - name: Verify native process report files
              run: node scripts/verify-process-reports.mjs
            - name: Events module oracle suite
              run: node scripts/run-suite.mjs events event-target
            - name: Core runtime oracle suites
              run: node scripts/run-suite.mjs core-runtime async
            - name: Buffer and Blob oracle suites
              run: node scripts/run-suite.mjs buffer
            # These exercise byte memory/FP conversions and the large Unicode/RegExp
            # preludes in addition to the CPU, math, GC and coroutine probes.
            - name: Portable language and built-in oracle suites
              run: node scripts/run-suite.mjs builtins
            - name: Filesystem oracle suite
              run: node scripts/run-suite.mjs fs
            - name: Portable process oracle suite
              run: node scripts/run-suite.mjs process
            - name: Child process oracle suite
              run: node scripts/run-suite.mjs child-process
            - name: Compare Linux examples with Node.js
              run: npm run compare:linux
              if: matrix.target == 'linux-arm64'
            - uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: loader-${{ matrix.target }}
                  path: work/platform-probes
    linux-distributions:
        name: Linux userspace ${{ matrix.image }}
        if: inputs.diagnostic_mode != 'startup-602' && inputs.diagnostic_mode != 'env-602' && inputs.diagnostic_mode != 'http602-current' && (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci'))
        runs-on: ubuntu-24.04
        strategy:
            fail-fast: false
            matrix:
                image:
                    [
                        "ubuntu:20.04",
                        "ubuntu:24.04",
                        "debian:12",
                        "fedora:43",
                        "alpine:3.22",
                    ]
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: npm
            - run: npm ci
            - run: npm run build
            - run: node scripts/build-platform-probes.mjs work/platform-probes linux-x64
            # Reuse exactly the same compiler output inside glibc and musl systems.
            - run: |
                  mkdir -p work/distro-results
                  docker run --rm -v "$PWD/work/platform-probes:/probes:ro" -v "$PWD/work/distro-results:/results" '${{ matrix.image }}' sh -c '
                    set -eu
                    ulimit -c 0
                    cd /results
                    /probes/linux-x64 > /results/loader.actual
                    for expected in /probes/linux-x64-*.expected; do
                      binary=${expected%.expected}
                      echo "Running $binary"
                      status=0
                      if [ "$(cat "$binary.minimal-environment")" = 1 ]; then env -i "$binary" > "/results/${binary##*/}.actual" || status=$?; else "$binary" > "/results/${binary##*/}.actual" || status=$?; fi
                      expected_status=0
                      if [ -f "$binary.status" ]; then expected_status=$(cat "$binary.status"); fi
                      if [ "$status" -ne "$expected_status" ]; then
                        echo "Unexpected exit status $status (expected $expected_status)"
                        exit 1
                      fi
                    done
                    cat /etc/os-release
                  '
                  cmp work/platform-probes/expected.txt work/distro-results/loader.actual
                  for expected in work/platform-probes/linux-x64-*.expected; do
                    binary=${expected%.expected}
                    cmp "$expected" "work/distro-results/${binary##*/}.actual"
                  done
            - run: node scripts/verify-process-reports.mjs work/distro-results
    http-startup-602:
        name: Optional HTTP startup investigation (diagnostic only)
        if: github.repository == '40oleg/nona' && github.event_name == 'workflow_dispatch' && inputs.diagnostic_mode == 'startup-602' && startsWith(github.ref, 'refs/heads/issue-602-startup-') && inputs.diagnostic_sha == github.sha
        runs-on: windows-2025
        permissions:
            contents: read
            actions: read
        timeout-minutes: 35
        concurrency:
            group: http-startup-602
            cancel-in-progress: false
        env:
            STARTUP_MODE: ${{ inputs.diagnostic_mode }}
            STARTUP_EXPECTED_SHA: ${{ inputs.diagnostic_sha }}
            NONA_AUTO_MERGE: "false"
            NONA_AUTO_RELEASE: "false"
        steps:
            - uses: actions/checkout@v4
              with:
                  repository: 40oleg/nona
                  ref: ${{ github.sha }}
                  fetch-depth: 0
                  persist-credentials: false
            - uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  architecture: x64
                  cache: npm
            - name: Verify exact temporary ref and hosted provenance before installation
              run: node scripts/http-startup.mjs --verify
            - run: npm ci
            - run: npm run build
            - name: Pure diagnostic regressions only (serial)
              run: node --test --test-concurrency=1 dist/tests/http-crash-acceptance.test.js dist/tests/http-startup.test.js
            - name: Install Windows debugging tools if absent (same SDK as original collector)
              shell: pwsh
              timeout-minutes: 8
              run: node scripts/http-startup-env.mjs pwsh -NoProfile -File scripts/http-startup-install.ps1
            - name: Configure original per-image fault collector unchanged
              run: node scripts/http-startup-env.mjs pwsh -NoProfile -File scripts/http-crash-windows.ps1 setup -Output work/http-startup
            - name: One attempt per startup probe, retained reference first
              env:
                  GH_TOKEN: ${{ github.token }}
              run: node scripts/http-startup.mjs
            - name: Cleanup owned debugger and children
              if: always()
              run: node scripts/http-startup-env.mjs pwsh -NoProfile -File scripts/http-startup-cleanup.ps1
            - name: Original fault dump analysis
              if: always()
              run: node scripts/http-startup-env.mjs pwsh -NoProfile -File scripts/http-crash-windows.ps1 collect -Output work/http-startup -Startup602
            - name: Remove original WER keys
              if: always()
              run: node scripts/http-startup-env.mjs pwsh -NoProfile -File scripts/http-crash-windows.ps1 cleanup -Output work/http-startup
            - uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: http-startup-602-${{ github.sha }}-${{ github.run_attempt }}
                  path: work/http-startup/
                  if-no-files-found: warn
                  retention-days: 30
    http-env-602:
        name: Optional environment count versus volume diagnostic (no product acceptance)
        if: github.repository == '40oleg/nona' && github.event_name == 'workflow_dispatch' && inputs.diagnostic_mode == 'env-602' && startsWith(github.ref, 'refs/heads/issue-602-startup-') && inputs.diagnostic_sha == github.sha && github.workflow_sha == github.sha && github.workflow_ref == format('40oleg/nona/.github/workflows/native-platforms.yml@{0}', github.ref)
        runs-on: windows-2025
        permissions:
            contents: read
            actions: read
        timeout-minutes: 35
        env:
            STARTUP_MODE: ${{ inputs.diagnostic_mode }}
            STARTUP_EXPECTED_SHA: ${{ inputs.diagnostic_sha }}
            NONA_AUTO_MERGE: "false"
            NONA_AUTO_RELEASE: "false"
        steps:
            - uses: actions/checkout@v4
              with:
                  repository: 40oleg/nona
                  ref: ${{ github.sha }}
                  fetch-depth: 0
                  persist-credentials: false
            - uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  architecture: x64
            - name: Verify driver and capture aggregate before token injection
              run: node scripts/http-startup-env-boundary.mjs --verify
            - name: Six serial same-host conditions using exact original artifact (no rebuild)
              env:
                  GH_TOKEN: ${{ github.token }}
              run: node scripts/http-startup-env-boundary.mjs
            - name: Cleanup exact owned Node, native and restore children
              if: always()
              run: node scripts/http-startup-env.mjs pwsh -NoProfile -File scripts/http-startup-cleanup.ps1
            - uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: http-env-602-${{ github.run_id }}-${{ github.run_attempt }}
                  path: work/http-startup/
                  if-no-files-found: warn
                  retention-days: 30
    http602-current:
        name: Current HTTP pressure and queued-close diagnostic (no product acceptance)
        if: github.repository == '40oleg/nona' && github.event_name == 'workflow_dispatch' && inputs.diagnostic_mode == 'http602-current' && startsWith(github.ref, 'refs/heads/issue-602-startup-') && inputs.diagnostic_sha == github.sha && github.workflow_sha == github.sha && github.workflow_ref == format('40oleg/nona/.github/workflows/native-platforms.yml@{0}', github.ref)
        runs-on: windows-2025
        timeout-minutes: 35
        env:
            HTTP602_MODE: ${{ inputs.diagnostic_mode }}
            HTTP602_EXPECTED_SHA: ${{ inputs.diagnostic_sha }}
            NONA_AUTO_MERGE: "false"
            NONA_AUTO_RELEASE: "false"
        steps:
            - uses: actions/checkout@v4
              with:
                  repository: 40oleg/nona
                  ref: ${{ github.sha }}
                  persist-credentials: false
            - uses: actions/setup-node@v4
              with:
                  node-version: "26.9.0"
                  architecture: x64
            - name: Verify exact candidate and workflow on the hosted temporary ref
              run: node scripts/http-crash-current.mjs --verify
            - name: Recover frozen original driver and server (never a retained native image)
              uses: actions/checkout@v4
              with:
                  repository: 40oleg/nona
                  ref: ab5ea083d793e0a665fde8b0a4b33bc1fa67208e
                  path: work/http602-current/soak-source
                  sparse-checkout: |
                      scripts/http-soak.mjs
                      bench/http/soak-server.mjs
                  sparse-checkout-cone-mode: false
                  persist-credentials: false
            - run: npm ci
            - run: npm run build
            - name: Pure current and legacy mode regressions (serial)
              run: node --test --test-concurrency=1 dist/tests/http-crash-current.test.js dist/tests/http-crash-acceptance.test.js dist/tests/http-crash-workflow.test.js dist/tests/http-crash-shards.test.js dist/tests/http-startup.test.js dist/tests/http-startup-env-boundary.test.js
            - name: Frozen-driver pure VM controls (no servers)
              shell: pwsh
              run: |
                  $env:LATENCY615_TEST_INPUT = Join-Path $env:GITHUB_WORKSPACE 'work/http602-current/soak-source/scripts/http-soak.mjs'
                  node --test --test-concurrency=1 scripts/http-soak-smoke-policy.test.mjs scripts/http-soak-check.test.mjs
            - name: Five-minute continuous native-off and Node pressure, then six bounded projections
              run: node scripts/http-crash-current.mjs
            - uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: http602-current-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
                  path: work/http602-current/
                  if-no-files-found: warn
                  retention-days: 30
    bsd-loaders:
        name: ${{ matrix.os }} x64 guest VM on Ubuntu host
        if: inputs.diagnostic_mode != 'startup-602' && inputs.diagnostic_mode != 'env-602' && inputs.diagnostic_mode != 'http602-current' && (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci'))
        runs-on: ubuntu-24.04
        strategy:
            fail-fast: false
            matrix:
                os: [freebsd, openbsd]
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: npm
            - run: npm ci
            - run: npm run build
            - run: node scripts/build-platform-probes.mjs work/platform-probes ${{ matrix.os }}-x64
            - uses: vmactions/freebsd-vm@v1
              if: matrix.os == 'freebsd'
              with:
                  release: "14.3"
                  usesh: true
                  run: |
                      set -eu
                      ulimit -c 0
                      uname -a
                      test "$(uname -s)" = FreeBSD
                      test "$(uname -m)" = amd64
                      chmod 755 work/platform-probes/freebsd-x64
                      work/platform-probes/freebsd-x64 > work/platform-probes/actual.txt
                      cmp work/platform-probes/expected.txt work/platform-probes/actual.txt
                      for probe in work/platform-probes/freebsd-x64-*.expected; do
                        binary=${probe%.expected}
                        echo "Running $binary"
                        chmod 755 "$binary"
                        minimal=$(cat "$binary.minimal-environment")
                        if { if [ "$minimal" = 1 ]; then env -i "$binary"; else "$binary"; fi; } > "$binary.actual"; then
                          status=0
                        else
                          status=$?
                        fi
                        expected_status=$(cat "$binary.status")
                        if [ "$status" -ne "$expected_status" ]; then
                          if command -v lldb >/dev/null 2>&1; then
                            lldb --batch -o run -o 'thread backtrace all' -o 'register read' -o 'disassemble --frame --count 12' "$binary" || true
                          fi
                          exit 1
                        fi
                        cmp "$probe" "$binary.actual"
                      done
                      uname -a
            - uses: vmactions/openbsd-vm@v1
              if: matrix.os == 'openbsd'
              with:
                  release: "7.8"
                  usesh: true
                  run: |
                      set -eu
                      ulimit -c 0
                      uname -a
                      test "$(uname -s)" = OpenBSD
                      test "$(uname -m)" = amd64
                      chmod 755 work/platform-probes/openbsd-x64
                      work/platform-probes/openbsd-x64 > work/platform-probes/actual.txt
                      cmp work/platform-probes/expected.txt work/platform-probes/actual.txt
                      for probe in work/platform-probes/openbsd-x64-*.expected; do
                        binary=${probe%.expected}
                        echo "Running $binary"
                        chmod 755 "$binary"
                        minimal=$(cat "$binary.minimal-environment")
                        if { if [ "$minimal" = 1 ]; then env -i "$binary"; else "$binary"; fi; } > "$binary.actual"; then status=0; else status=$?; fi
                        expected_status=$(cat "$binary.status")
                        if [ "$status" -ne "$expected_status" ]; then exit 1; fi
                        cmp "$probe" "$binary.actual"
                      done
                      uname -a
            - uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: loader-${{ matrix.os }}-x64
                  path: work/platform-probes
            - run: node scripts/verify-process-reports.mjs
