name: native-platforms
on:
  push:
    branches: [issue-117-native-platforms]
  workflow_dispatch:
    inputs:
      regression_scope:
        description: Windows regression scope
        type: choice
        options: [full, cli]
        default: full
  pull_request:
    paths:
      - 'src/backend/**'
      - 'src/target.ts'
      - 'scripts/*platform-probes.mjs'
      - '.github/workflows/native-platforms.yml'
permissions:
  contents: read
concurrency:
  group: native-platforms-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true
jobs:
  windows-regression:
    # Complete regressions run before PR readiness; development pushes use the
    # native probes and focused Linux regression below.
    if: github.event_name != 'push'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26.9.0'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node --test dist/tests/cli.test.js
      - run: npm run check
        if: github.event.inputs.regression_scope != 'cli'
      - run: npm run compare
        if: github.event.inputs.regression_scope != 'cli'
  linux-regression:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26.9.0'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node --test dist/tests/elf.test.js dist/tests/x64.test.js dist/tests/base-cache.test.js dist/tests/native-targets.test.js dist/tests/machine-context.test.js dist/tests/machine-operations.test.js dist/tests/macho.test.js dist/tests/elf-platform-layout.test.js dist/tests/platform-probes.test.js dist/tests/bsd.test.js dist/tests/arm64-assembler.test.js dist/tests/arm64-relocations.test.js dist/tests/arm64-image-relocations.test.js dist/tests/arm64-math.test.js dist/tests/arm64-runtime-emission.test.js dist/tests/linux-arm64.test.js dist/tests/linux-arm64-host.test.js
      - run: npm run compare:linux
  loaders:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-24.04, target: linux-x64}
          - {runner: ubuntu-24.04-arm, target: linux-arm64}
          - {runner: macos-15-intel, target: darwin-x64}
          - {runner: macos-15, target: darwin-arm64}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26.9.0'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/build-platform-probes.mjs
      - run: node scripts/run-platform-probes.mjs ${{ matrix.target }}
      - run: node --test dist/tests/math.test.js dist/tests/numeric.test.js dist/tests/gc.test.js dist/tests/generators.test.js dist/tests/async.test.js dist/tests/promise.test.js dist/tests/atomics.test.js dist/tests/process.test.js dist/tests/fs.test.js
        if: matrix.target == 'linux-arm64'
      - run: npm run compare:linux
        if: matrix.target == 'linux-arm64'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: loader-${{ matrix.target }}
          path: work/platform-probes
  bsd-loaders:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        os: [freebsd, openbsd]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26.9.0'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/build-platform-probes.mjs
      - uses: vmactions/freebsd-vm@v1
        if: matrix.os == 'freebsd'
        with:
          release: '14.3'
          usesh: true
          run: |
            set -eu
            test "$(uname -m)" = amd64
            chmod 755 work/platform-probes/freebsd-x64
            work/platform-probes/freebsd-x64 > work/platform-probes/actual.txt
            cmp work/platform-probes/expected.txt work/platform-probes/actual.txt
            for probe in work/platform-probes/freebsd-x64-*.expected; do
              binary=${probe%.expected}
              echo "Running $binary"
              chmod 755 "$binary"
              if "$binary" > "$binary.actual"; then
                :
              else
                status=$?
                if command -v lldb >/dev/null 2>&1; then
                  lldb --batch -o run -o 'thread backtrace all' -o 'register read' -o 'disassemble --frame --count 12' "$binary" || true
                fi
                exit "$status"
              fi
              cmp "$probe" "$binary.actual"
            done
            uname -a
      - uses: vmactions/openbsd-vm@v1
        if: matrix.os == 'openbsd'
        with:
          release: '7.8'
          usesh: true
          run: |
            set -eu
            test "$(uname -m)" = amd64
            chmod 755 work/platform-probes/openbsd-x64
            work/platform-probes/openbsd-x64 > work/platform-probes/actual.txt
            cmp work/platform-probes/expected.txt work/platform-probes/actual.txt
            for probe in work/platform-probes/openbsd-x64-*.expected; do
              binary=${probe%.expected}
              echo "Running $binary"
              chmod 755 "$binary"
              "$binary" > "$binary.actual"
              cmp "$probe" "$binary.actual"
            done
            uname -a
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: loader-${{ matrix.os }}-x64
          path: work/platform-probes
