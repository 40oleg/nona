name: native-platforms
on:
  push:
    branches: [issue-117-native-platforms]
  workflow_dispatch:
    inputs:
      regression_scope:
        description: Windows regression scope
        type: choice
        options: [full, cli]
        default: full
  pull_request:
    paths:
      - 'src/backend/**'
      - 'src/target.ts'
      - 'scripts/*platform-probes.mjs'
      - '.github/workflows/native-platforms.yml'
permissions:
  contents: read
concurrency:
  group: native-platforms-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true
jobs:
  browser-compiler:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26.9.0'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            site/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm ci
        working-directory: site
      - run: npm run build
        working-directory: site
      - run: npm run check:playground
        working-directory: site
      - run: npm run check:samples
        working-directory: site
      - run: npm run check:links
        working-directory: site
  windows-regression:
    # Complete regressions run before PR readiness; development pushes use the
    # native probes and focused Linux regression below.
    if: github.event_name != 'push'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26.9.0'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node --test dist/tests/cli.test.js
      - run: npm run check
        if: github.event.inputs.regression_scope != 'cli'
      - run: npm run compare
        if: github.event.inputs.regression_scope != 'cli'
  linux-regression:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26.9.0'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node --test dist/tests/elf.test.js dist/tests/x64.test.js dist/tests/base-cache.test.js dist/tests/native-targets.test.js dist/tests/machine-context.test.js dist/tests/machine-operations.test.js dist/tests/macho.test.js dist/tests/elf-platform-layout.test.js dist/tests/platform-probes.test.js dist/tests/bsd.test.js dist/tests/arm64-assembler.test.js dist/tests/arm64-relocations.test.js dist/tests/arm64-image-relocations.test.js dist/tests/arm64-math.test.js dist/tests/arm64-runtime-emission.test.js dist/tests/linux-arm64.test.js dist/tests/linux-arm64-host.test.js dist/tests/darwin-runtime.test.js dist/tests/arm64-windows-bridge.test.js dist/tests/arm64-page-geometry.test.js dist/tests/sha256.test.js dist/tests/native-ffi-targets.test.js
      - run: npm run compare:linux
  loaders:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-24.04, target: linux-x64}
          - {runner: ubuntu-24.04-arm, target: linux-arm64}
          - {runner: macos-15-intel, target: darwin-x64}
          - {runner: macos-15, target: darwin-arm64}
          - {runner: windows-11-arm, target: win32-arm64}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26.9.0'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/build-platform-probes.mjs
      - run: node scripts/run-platform-probes.mjs ${{ matrix.target }}
      - run: node --test dist/tests/math.test.js dist/tests/numeric.test.js dist/tests/gc.test.js dist/tests/generators.test.js dist/tests/async.test.js dist/tests/promise.test.js dist/tests/atomics.test.js
        if: matrix.target == 'linux-arm64' || matrix.target == 'darwin-x64' || matrix.target == 'win32-arm64'
      # These exercise byte memory/FP conversions and the large Unicode/RegExp
      # preludes in addition to the CPU, math, GC and coroutine probes.
      - run: node --test dist/tests/date.test.js dist/tests/array-builtins.test.js dist/tests/array-buffer.test.js dist/tests/typed-array-fast-path.test.js dist/tests/string-builtins.test.js dist/tests/string-search.test.js dist/tests/string-split.test.js dist/tests/string-replace.test.js dist/tests/string-replace-all.test.js dist/tests/string-match.test.js dist/tests/regexp-vm.test.js dist/tests/regexp-construction.test.js dist/tests/regexp-split.test.js dist/tests/regexp-replace.test.js dist/tests/regexp-match-all.test.js dist/tests/map.test.js dist/tests/set.test.js dist/tests/weak-collections.test.js dist/tests/proxy.test.js dist/tests/reflect.test.js dist/tests/symbols.test.js dist/tests/json.test.js dist/tests/uri.test.js dist/tests/classes.test.js dist/tests/class-fields.test.js dist/tests/exceptions.test.js dist/tests/objects.test.js dist/tests/object-integrity.test.js dist/tests/object-introspection.test.js dist/tests/property-descriptors.test.js
        if: matrix.target == 'linux-arm64' || matrix.target == 'darwin-x64' || matrix.target == 'win32-arm64'
      - run: node --test dist/tests/process.test.js dist/tests/fs.test.js
        if: matrix.target == 'linux-arm64' || matrix.target == 'win32-arm64'
      - run: npm run compare:linux
        if: matrix.target == 'linux-arm64'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: loader-${{ matrix.target }}
          path: work/platform-probes
  linux-distributions:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        image: ['ubuntu:20.04', 'ubuntu:24.04', 'debian:12', 'fedora:43', 'alpine:3.22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26.9.0'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/build-platform-probes.mjs
      # Reuse exactly the same compiler output inside glibc and musl systems.
      - run: |
          mkdir -p work/distro-results
          docker run --rm -v "$PWD/work/platform-probes:/probes:ro" -v "$PWD/work/distro-results:/results" '${{ matrix.image }}' sh -c '
            set -eu
            /probes/linux-x64 > /results/loader.actual
            for expected in /probes/linux-x64-*.expected; do
              binary=${expected%.expected}
              echo "Running $binary"
              "$binary" > "/results/${binary##*/}.actual"
            done
            cat /etc/os-release
          '
          cmp work/platform-probes/expected.txt work/distro-results/loader.actual
          for expected in work/platform-probes/linux-x64-*.expected; do
            binary=${expected%.expected}
            cmp "$expected" "work/distro-results/${binary##*/}.actual"
          done
  bsd-loaders:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        os: [freebsd, openbsd]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26.9.0'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/build-platform-probes.mjs
      - uses: vmactions/freebsd-vm@v1
        if: matrix.os == 'freebsd'
        with:
          release: '14.3'
          usesh: true
          run: |
            set -eu
            test "$(uname -m)" = amd64
            chmod 755 work/platform-probes/freebsd-x64
            work/platform-probes/freebsd-x64 > work/platform-probes/actual.txt
            cmp work/platform-probes/expected.txt work/platform-probes/actual.txt
            for probe in work/platform-probes/freebsd-x64-*.expected; do
              binary=${probe%.expected}
              echo "Running $binary"
              chmod 755 "$binary"
              if "$binary" > "$binary.actual"; then
                :
              else
                status=$?
                if command -v lldb >/dev/null 2>&1; then
                  lldb --batch -o run -o 'thread backtrace all' -o 'register read' -o 'disassemble --frame --count 12' "$binary" || true
                fi
                exit "$status"
              fi
              cmp "$probe" "$binary.actual"
            done
            uname -a
      - uses: vmactions/openbsd-vm@v1
        if: matrix.os == 'openbsd'
        with:
          release: '7.8'
          usesh: true
          run: |
            set -eu
            test "$(uname -m)" = amd64
            chmod 755 work/platform-probes/openbsd-x64
            work/platform-probes/openbsd-x64 > work/platform-probes/actual.txt
            cmp work/platform-probes/expected.txt work/platform-probes/actual.txt
            for probe in work/platform-probes/openbsd-x64-*.expected; do
              binary=${probe%.expected}
              echo "Running $binary"
              chmod 755 "$binary"
              "$binary" > "$binary.actual"
              cmp "$probe" "$binary.actual"
            done
            uname -a
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: loader-${{ matrix.os }}-x64
          path: work/platform-probes
