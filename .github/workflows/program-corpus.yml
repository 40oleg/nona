name: program corpus
env:
    NODE_VERSION: "26.9.0"

# Branch pushes are checked by their pull request.
on:
    push:
        branches: [main]
    pull_request:

permissions:
    contents: read
    actions: read

concurrency:
    # A pull request has one group (head_ref): a newer push cancels the older
    # run. On main the group is the branch and nothing is cancelled: the
    # running check finishes and a newer merge replaces the pending one, so a
    # burst of merges is checked once, on its last commit (#353). check.yml
    # still checks every commit of main (#42).
    group: program-corpus-${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    route:
        # Where the Windows job runs: GitHub-hosted windows-latest, or the
        # owner's self-hosted Windows runner when hosted Windows jobs already
        # wait in the queue and that runner is online and idle. Forks always
        # stay hosted (scripts/pick-runner.mjs, docs/ci-runners.md).
        runs-on: ubuntu-latest
        permissions:
            contents: read
            actions: read
        outputs:
            windows: ${{ steps.pick.outputs.runner }}
        steps:
            - uses: actions/checkout@v4
              with:
                  sparse-checkout: scripts/pick-runner.mjs
                  sparse-checkout-cone-mode: false
            - id: pick
              run: node scripts/pick-runner.mjs
              env:
                  GITHUB_TOKEN: ${{ github.token }}
                  RUNNER_STATUS_TOKEN: ${{ secrets.RUNNER_STATUS_TOKEN }}
                  TRUSTED: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && !startsWith(github.head_ref, 'nona/issue-') }}
    programs:
        name: programs (${{ matrix.os }})
        needs: route
        runs-on: ${{ matrix.os == 'windows-latest' && fromJSON(needs.route.outputs.windows) || matrix.os }}
        timeout-minutes: 60
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, windows-latest]
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: npm
            - run: npm ci
            - run: npm run check:programs
              env:
                  # Pull requests run each program once, without GC stress,
                  # unless the gc-stress label is set; main runs both (#372).
                  NONA_GC_STRESS: ${{ github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'gc-stress') && 'off' || '' }}
