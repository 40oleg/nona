name: program corpus
env:
  NODE_VERSION: '26.9.0'

# Branch pushes are checked by their pull request.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  # A pull request has one group (head_ref): a newer push cancels the older
  # run. A push to main has one group per commit (sha), so the next merge
  # does not cancel the check of the previous one (#42).
  group: program-corpus-${{ github.event_name }}-${{ github.head_ref || github.sha }}
  cancel-in-progress: true

jobs:
  programs:
    name: programs (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run check:programs
